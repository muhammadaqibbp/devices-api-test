services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Devices_Dev_Passw0rd!}
    volumes:
      - devices-db-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Devices: Server=db,1433;Database=devices;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Devices_Dev_Passw0rd!};TrustServerCertificate=True
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  devices-db-data:
